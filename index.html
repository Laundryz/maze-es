<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>脱出迷宮</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="appArea" class="app-container">
    <header class="page-header">
      <h1>脱出迷宮</h1>
      <p>スタートとゴールのQRコードを読み取ってください。</p>
    </header>

    <section class="timer-card" aria-live="polite">
      <p class="timer-label">残り時間</p>
      <div id="time" class="timer">08:00.000</div>
      <p id="gameStatus" class="status">カメラを起動してスタートQRコードを読み取ってください。</p>
    </section>

    <section class="scanner-card">
      <h2>QRコード読み取り</h2>
      <div id="videoFrame" class="video-frame">
        <div id="cameraPlaceholder" class="camera-placeholder">
          <!-- カメラ映像をこのエリア内に表示します -->
          <video
            id="cameraPreview"
            class="camera-preview"
            autoplay
            muted
            playsinline
            aria-label="カメラプレビュー"></video>

          <!-- カメラ停止中だけ表示するメッセージ -->
          <div id="cameraPlaceholderMessage" class="camera-placeholder-message">
            <span class="camera-icon" aria-hidden="true">▣</span>
            <span>カメラは停止中です</span>
          </div>
        </div>
      </div>
      <div class="button-row">
        <button id="startCameraBtn" class="primary-button" type="button">カメラを起動</button>
        <button id="stopCameraBtn" class="secondary-button" type="button" disabled>カメラを停止</button>
      </div>
      <p class="help-text">カメラを起動し、QRコードをカメラに映してください。スタートを読み取った後もカメラは起動したままです。</p>
    </section>

    <section id="submitArea" class="submit-card" hidden>
      <h2 id="resultHeading">ゴール！</h2>
      <p id="resultTime" class="result-time"></p>
      <label for="playerName">プレイヤー名</label>
      <input type="text" id="playerName" maxlength="30" placeholder="プレイヤー名を入力" autocomplete="off">
      <button id="submitBtn" class="success-button" type="button">ランキングに登録</button>
      <p id="submitStatus" class="status" aria-live="polite"></p>
    </section>


    <footer class="page-footer">脱出迷宮</footer>
  </main>

  <!-- GASへの送信結果を受け取るための非表示フレーム -->
  <iframe name="gasResultFrame" id="gasResultFrame" title="送信結果" class="hidden-frame"></iframe>
  <canvas id="scanCanvas" hidden></canvas>

  <!-- QRコード読み取り・生成ライブラリ（利用にはインターネット接続が必要） -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
